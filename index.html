<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- MOBILE + FULLSCREEN FIX -->
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#000000">

<!-- iOS PWA SUPPORT -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reconnection Initiative">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<title>Reconnection Initiative</title>

<link rel="stylesheet" href="styles.css">

<!-- Prevent iOS zoom on input focus -->
<style>
input, button {
    font-size: 16px;
}
</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="boot">
    <div id="bootText"></div>
</div>

<div id="loginContainer">

    <div class="loginBox">
        <h1></h1>

        <input id="email" placeholder="EMAIL" autocomplete="username">
        <br>
        <input id="password" type="password" placeholder="PASSWORD KEY" autocomplete="current-password">
        <br>
        <button id="loginBtn">AUTHENTICATE</button>

        <p id="error"></p>
    </div>

</div>

<div id="terminalContainer">

    <div id="terminalOutput"></div>

    <div class="inputRow">
        <span class="prompt">hello@world.ca:~$</span>

        <input id="commandInput" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/>

        <button id="enterBtn">⏎</button>
    </div>

</div>

<script type="module" src="app.js"></script>
<script src="matrix.js"></script>

<!-- SERVICE WORKER REGISTRATION -->
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.log("Service Worker failed:", err));
    });
}
</script>

</body>
</html>
